name: fusion-04
description: |
  Three-wide PIV + forced fuse. Real logic / invariants.
  Three parallel PIV implementers (@panel-a/b/c), one @judge fuse.

nodes:
  - id: panel
    include: fusion-panel-piv-3

  - id: judge
    command: fusion-judge-impl-fuse-forced
    model: '@judge'
    retry: {max_attempts: 5, delay_ms: 5000, on_error: all}
    context: fresh
    depends_on: [panel]
    output_format:
      type: object
      properties:
        verdict: { type: string }
        mode: { type: string, enum: [fuse] }
        chosen: { type: string, enum: [a, b, c] }
      required: [verdict, mode, chosen]

  - id: finish
    include: fusion-finish
    depends_on: [judge]
