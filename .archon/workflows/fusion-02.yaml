name: fusion-02
description: |
  Three-wide oneshot implement + forced fuse. Easy unspecified / robustness.
  Three parallel panel implementers (@panel-a/b/c), one @judge fuse, one result.
  Triggers: tactic fusion-02. NOT a replacement for review/conflict workflows.

nodes:
  - id: panel
    include: fusion-panel-impl-3

  - id: judge
    command: fusion-judge-impl-fuse-forced
    model: '@judge'
    retry: {max_attempts: 5, delay_ms: 5000, on_error: all}
    context: fresh
    depends_on: [panel]
    output_format:
      type: object
      properties:
        verdict: { type: string }
        mode: { type: string, enum: [fuse] }
        chosen: { type: string, enum: [a, b, c] }
      required: [verdict, mode, chosen]

  - id: finish
    include: fusion-finish
    depends_on: [judge]
