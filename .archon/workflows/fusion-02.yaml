name: fusion-02
description: |
  Two-wide oneshot implement + forced fuse. Easy unspecified / robustness.
  Two parallel small-tier implementers, one large-tier judge, one fused result.
  Triggers: tactic fusion-02. NOT a replacement for review/conflict workflows.

nodes:
  - id: panel
    include: fusion-panel-impl-2

  - id: judge
    command: fusion-judge-impl-fuse-forced
    model: large
    retry: {max_attempts: 5, delay_ms: 5000, on_error: all}
    context: fresh
    depends_on: [panel]
    output_format:
      type: object
      properties:
        verdict: { type: string }
        mode: { type: string, enum: [fuse] }
        chosen: { type: string, enum: [a, b] }
      required: [verdict, mode, chosen]

  - id: finish
    include: fusion-finish
    depends_on: [judge]
