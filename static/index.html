<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6f7f9">
<title>Health Records</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' http://127.0.0.1:8080 http://127.0.0.1:8787; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'self'">
<style>
  :root { --bg:#f6f7f9; --user:#2563eb; --user-fg:#fff; --ai:#fff; --text:#1a1d21; --muted:#6b7280; --border:#e5e7eb; --accent:#2563eb; --code:#f3f4f6; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; }
  body {
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background:var(--bg); color:var(--text);
    display:flex; flex-direction:column; height:100dvh;
  }
  header {
    padding: calc(env(safe-area-inset-top) + 12px) 16px 10px;
    border-bottom:1px solid var(--border); background:var(--bg);
    display:flex; align-items:baseline; gap:10px;
  }
  header h1 { font-size:17px; font-weight:600; }
  header span { font-size:12px; color:var(--muted); }
  #messages { flex:1; overflow-y:auto; padding:14px 14px 8px; -webkit-overflow-scrolling:touch; }
  .msg { max-width:92%; padding:12px 14px; border-radius:16px; font-size:16px; line-height:1.5; margin-bottom:12px; }
  .msg.user { background:var(--user); color:var(--user-fg); margin-left:auto; border-bottom-right-radius:4px; white-space:pre-wrap; word-wrap:break-word; }
  .msg.ai { background:var(--ai); border:1px solid var(--border); border-bottom-left-radius:4px; }
  .msg.ai.err { border-color:#fca5a5; color:#b91c1c; }

  /* markdown body */
  .answer-body > *:first-child { margin-top:0; }
  .answer-body > *:last-child { margin-bottom:0; }
  .answer-body p { margin:8px 0; }
  .answer-body h1, .answer-body h2, .answer-body h3, .answer-body h4 { margin:14px 0 6px; font-size:1.05em; }
  .answer-body h1 { font-size:1.2em; } .answer-body h2 { font-size:1.1em; }
  .answer-body ul, .answer-body ol { padding-left:22px; margin:8px 0; }
  .answer-body li { margin:3px 0; }
  .answer-body strong { font-weight:600; }
  .answer-body code { background:var(--code); padding:1px 5px; border-radius:5px; font-size:0.9em; font-family:ui-monospace, SFMono-Regular, Menlo, monospace; }
  .answer-body pre { background:var(--code); padding:10px; border-radius:8px; overflow-x:auto; margin:8px 0; }
  .answer-body pre code { background:none; padding:0; }
  .answer-body table { border-collapse:collapse; margin:8px 0; font-size:0.92em; width:100%; }
  .answer-body th, .answer-body td { border:1px solid var(--border); padding:5px 8px; text-align:left; }
  .answer-body th { background:var(--code); }
  .answer-body a { color:var(--accent); text-decoration:underline; word-break:break-all; }

  /* thinking */
  .think { margin-bottom:8px; border:1px solid var(--border); border-radius:10px; background:var(--bg); }
  .think summary { padding:7px 12px; font-size:12px; color:var(--muted); cursor:pointer; user-select:none; }
  .think .think-body { padding:0 12px 10px; font-size:13px; color:var(--muted); line-height:1.5;
    max-height:220px; overflow-y:auto; border-top:1px solid var(--border); padding-top:8px; }
  .think .think-body > *:first-child { margin-top:0; }
  .think .think-body ul, .think .think-body ol { padding-left:18px; margin:4px 0; }

  .msg .srcs { display:block; margin-top:10px; font-size:12px; color:var(--muted); border-top:1px solid var(--border); padding-top:6px; }
  .cursor { display:inline-block; width:7px; height:16px; background:var(--accent); vertical-align:-2px; animation:blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity:0; } }
  #composer {
    padding: 8px 14px calc(env(safe-area-inset-bottom) + 10px);
    border-top:1px solid var(--border); background:var(--bg);
    display:flex; align-items:flex-end; gap:8px;
  }
  #input {
    flex:1; resize:none; border:1px solid var(--border); border-radius:18px;
    padding:10px 14px; font-size:16px; font-family:inherit; line-height:1.35;
    max-height:120px; background:#fff; outline:none;
  }
  #input:focus { border-color:var(--accent); }
  #send {
    border:none; border-radius:50%; width:40px; height:40px; flex:0 0 40px;
    background:var(--accent); color:#fff; font-size:18px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  #send:disabled { opacity:.4; }
  #gate {
    position:fixed; inset:0; background:var(--bg); z-index:10;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:24px;
  }
  #gate h2 { font-size:18px; font-weight:600; }
  #gate input {
    border:1px solid var(--border); border-radius:12px; padding:12px 16px;
    font-size:18px; text-align:center; width:220px; outline:none; background:#fff;
  }
  #gate button {
    border:none; border-radius:12px; padding:12px 32px; font-size:16px;
    background:var(--accent); color:#fff; cursor:pointer;
  }
  #upload { padding:10px 14px; border-top:1px solid var(--border); background:#fff; }
  #drop-zone { border:2px dashed var(--border); border-radius:12px; padding:14px; text-align:center; cursor:pointer; transition:border-color .15s, background .15s; }
  #drop-zone.dragover { border-color:var(--accent); background:#eef2ff; }
  #drop-zone .dz-main { font-size:14px; font-weight:500; }
  #drop-zone .dz-link { color:var(--accent); text-decoration:underline; cursor:pointer; }
  #drop-zone .dz-sub { font-size:12px; color:var(--muted); margin-top:4px; }
  #upload-actions { display:flex; gap:8px; margin-top:8px; align-items:center; }
  #upload-btn { border:none; border-radius:10px; padding:8px 16px; font-size:14px; background:var(--accent); color:#fff; cursor:pointer; }
  #upload-btn:disabled { opacity:.4; cursor:default; }
  #upload-status { font-size:13px; color:var(--muted); }
  #preview { margin-top:10px; border:1px solid var(--border); border-radius:10px; overflow:hidden; }
  #preview .prev-head { padding:8px 12px; font-size:13px; font-weight:600; border-bottom:1px solid var(--border); background:var(--bg); }
  #preview .prev-file { padding:8px 12px; font-size:13px; border-bottom:1px solid var(--border); background:#fff; }
  #preview .prev-file:last-child { border-bottom:none; }
  #preview .prev-file .pf-name { font-weight:600; }
  #preview .prev-file .pf-status { color:var(--muted); }
  #preview table { width:100%; border-collapse:collapse; font-size:12px; margin-top:6px; }
  #preview th, #preview td { border:1px solid var(--border); padding:4px 6px; text-align:left; }
  #preview th { background:var(--code); font-weight:600; }
  .disclaimer { text-align:center; font-size:12px; color:var(--muted); padding:6px 12px; border-top:1px solid var(--border); background:#fff; }
  #logout { border:1px solid var(--border); border-radius:8px; padding:6px 12px; font-size:13px; background:#fff; color:var(--muted); cursor:pointer; }
  #logout:hover { color:var(--text); border-color:var(--muted); }
</style>
</head>
<body>
<div id="gate" style="display:none">
  <h2>Health Records</h2>
  <input id="code" type="password" inputmode="text" autocomplete="off" placeholder="Passcode" autocapitalize="off" spellcheck="false">
  <button id="unlock">Open</button>
  <div class="hint">Passcode was printed when the server started — check your terminal.</div>
</div>
<header>
  <h1>Health Records</h1>
  <span id="status"></span>
  <button id="logout" style="margin-left:auto" title="Clear passcode and lock">Logout</button>
</header>
<main id="messages"></main>

<div id="upload">
  <div id="drop-zone" tabindex="0" role="button" aria-label="Upload lab PDFs">
    <div class="dz-main">Drop PDFs here or <label for="file-input" class="dz-link">choose files</label></div>
    <div class="dz-sub">PDF, TXT, MD — stays on this device, private to you</div>
    <input id="file-input" type="file" multiple accept=".pdf,.txt,.md,application/pdf" hidden>
  </div>
  <div id="upload-actions">
    <button id="upload-btn" disabled>Upload</button>
    <span id="upload-status"></span>
  </div>
  <div id="preview" style="display:none"></div>
</div>

<div class="disclaimer">Not medical advice — see DISCLAIMER.md</div>
<div id="composer">
  <textarea id="input" rows="1" placeholder="Ask about your records…" enterkeyhint="send"></textarea>
  <button id="send" aria-label="Send">↑</button>
</div>

<script src="/static/marked.min.js"></script>
<script src="/static/purify.min.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
