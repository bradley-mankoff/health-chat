[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "health-chat"
version = "0.1.0"
description = "Private, local health-records chat — grounded Q&A over your own lab PDFs with trusted guideline references"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Bradley Mankoff" }]
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "pypdf>=4.2",
  "rank-bm25>=0.2.2",
  "pydantic>=2.6",
  "python-multipart>=0.0.9",
]

[project.urls]
Repository = "https://github.com/bradley-mankoff/health-chat"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio"]

[tool.setuptools]
py_modules = ["server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
